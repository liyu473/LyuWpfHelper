name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '测试模式（只构建不发布）'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    environment: release
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: NuGet Login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        id: login
        with:
          user: liyu473

      - name: Pack LyuWpfHelper
        run: dotnet pack LyuWpfHelper/LyuWpfHelper.csproj -c Release -o ./nupkgs

      - name: Push LyuWpfHelper to NuGet
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs/LyuWpfHelper.*.nupkg
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        with:
          files: |
            ./nupkgs/*.nupkg
          generate_release_notes: true
